<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Défi Santé — Classement</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .podium{display:flex;justify-content:center;align-items:flex-end;gap:1.25rem;padding:2rem 0 1.5rem}
    .p-item{display:flex;flex-direction:column;align-items:center;gap:.3rem}
    .p-av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
    .p-bloc{display:flex;align-items:flex-end;justify-content:center;border-radius:var(--radius-sm) var(--radius-sm) 0 0;font-size:1.4rem;padding-bottom:.5rem}
    .p-1 .p-av{width:64px;height:64px;font-size:1.25rem;background:linear-gradient(135deg,#f5c842,#e8923d);color:#1a0f00}
    .p-2 .p-av{width:52px;height:52px;font-size:1rem;background:linear-gradient(135deg,#b0bec5,#78909c);color:#0d1117}
    .p-3 .p-av{width:44px;height:44px;font-size:.85rem;background:linear-gradient(135deg,#cd7f32,#a0522d);color:#1a0800}
    .p-1 .p-bloc{background:rgba(245,200,66,.09);border:1px solid rgba(245,200,66,.2);height:110px;width:88px}
    .p-2 .p-bloc{background:rgba(176,190,197,.07);border:1px solid rgba(176,190,197,.15);height:80px;width:78px}
    .p-3 .p-bloc{background:rgba(205,127,50,.07);border:1px solid rgba(205,127,50,.15);height:60px;width:72px}
    .p-nom{font-size:.78rem;font-weight:700;color:var(--text);text-align:center;max-width:88px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .p-pts{font-size:.72rem;color:var(--text3)}
    .cl-row{display:flex;align-items:center;gap:.875rem;padding:.7rem .75rem;border-radius:var(--radius-sm);transition:background .12s}
    .cl-row:hover{background:var(--bg3)}
    .cl-row.moi{background:var(--accent-bg);border:1px solid rgba(61,220,132,.15)}
    .cl-rang{width:34px;text-align:center;font-size:.95rem;font-weight:700;flex-shrink:0}
    .cl-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;flex-shrink:0}
    .cl-info{flex:1;min-width:0}
    .cl-nom{font-size:.875rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cl-sub{font-size:.72rem;color:var(--text3);margin-top:.1rem}
    .cl-bar{width:60px;flex-shrink:0}
    .cl-pts{font-family:var(--font-head);font-size:.95rem;font-weight:800;color:var(--accent);min-width:55px;text-align:right;flex-shrink:0}
    .eq-row{display:flex;align-items:center;gap:1rem;padding:.875rem 0;border-bottom:1px solid var(--border)}
    .eq-row:last-child{border-bottom:none}
  </style>
</head>
<body>
<nav class="nav"><div class="nav-inner">
  <a href="/pages/tableau-de-bord.html" class="nav-logo"><span class="logo-dot"></span> Défi Santé</a>
  <div class="nav-links">
    <a href="/pages/tableau-de-bord.html" class="nav-link">Tableau de bord</a>
    <a href="/pages/saisie.html" class="nav-link">Saisir activité</a>
    <a href="/pages/mes-activites.html" class="nav-link">Mes activités</a>
    <a href="/pages/classement.html" class="nav-link active">Classement</a>
    <a href="/pages/equipes.html" class="nav-link">Équipes</a>
    <a href="/pages/gestion.html" class="nav-link nav-gestionnaire">Gestion</a>
  </div>
  <div class="nav-user"></div>
</div></nav>
<div class="page">
  <div class="page-header">
    <div><div class="page-title">Classement</div><div class="page-subtitle" id="cl-sub">Classement général</div></div>
    <select id="f-defi" class="form-control" style="width:auto" onchange="loadAll()"><option value="">Tous les défis</option></select>
  </div>
  <div class="stat-grid">
    <div class="stat-card green"><div class="stat-label">Points générés</div><div class="stat-value" id="g-pts">—</div></div>
    <div class="stat-card blue"><div class="stat-label">Participants</div><div class="stat-value" id="g-part">—</div></div>
    <div class="stat-card orange"><div class="stat-label">Heures d'activité</div><div class="stat-value" id="g-h">—</div></div>
    <div class="stat-card red"><div class="stat-label">Saisies totales</div><div class="stat-value" id="g-nb">—</div></div>
  </div>
  <div class="tabs" data-group="cl">
    <button class="tab-btn active" data-tab="part" data-group="cl">Participants</button>
    <button class="tab-btn" data-tab="equipes" data-group="cl">Équipes</button>
    <button class="tab-btn" data-tab="pop" data-group="cl">Activités populaires</button>
    <button class="tab-btn" data-tab="stats" data-group="cl">Statistiques</button>
  </div>
  <div class="tab-panel active" data-panel="part" data-group="cl">
    <div class="card">
      <div id="podium"></div>
      <div id="cl-list"><div class="loading-center"><div class="spinner"></div></div></div>
    </div>
  </div>
  <div class="tab-panel" data-panel="equipes" data-group="cl">
    <div class="card"><div id="cl-eq"><div class="loading-center"><div class="spinner"></div></div></div></div>
  </div>
  <div class="tab-panel" data-panel="pop" data-group="cl">
    <div class="card">
      <div class="card-title">Activités les plus pratiquées</div>
      <div class="table-wrap"><table><thead><tr><th>#</th><th>Activité</th><th>Saisies</th><th>Minutes</th><th>Points</th></tr></thead>
      <tbody id="pop-tb"></tbody></table></div>
    </div>
  </div>
  <div class="tab-panel" data-panel="stats" data-group="cl">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
      <div class="card"><div class="card-title">Répartition par sexe</div><div id="rep-sexe"></div></div>
      <div class="card"><div class="card-title">Résumé global</div><div id="resume"></div></div>
    </div>
  </div>
</div>
<script src="/js/app.js"></script>
<script>
if(!Auth.requireAuth())throw 0;
const user=Auth.getUser();
async function init(){
  try{
    const defis=await GET("/defis/");
    const sel=document.getElementById("f-defi");
    defis.forEach(d=>{const o=document.createElement("option");o.value=d.id_defi;o.textContent=d.nom;if(d.actif)o.selected=true;sel.appendChild(o);});
  }catch{}
  await loadAll();
  initTabs();
}
function p(){const v=document.getElementById("f-defi").value;return v?`?id_defi=${v}`:"";}
async function loadAll(){await Promise.all([loadPart(),loadEq(),loadPop(),loadStats()]);}
async function loadPart(){
  try{
    const cl=await GET(`/stats/classement/participants${p()}`);
    const mx=cl[0]?.total_points||1;
    const t3=cl.slice(0,3);
    if(t3.length>=2){
      const ord=t3.length>=3?[t3[1],t3[0],t3[2]]:[t3[0]];
      const sz=t3.length>=3?["p-2","p-1","p-3"]:["p-1"];
      const em=["🥈","🥇","🥉"];
      document.getElementById("podium").innerHTML=`<div class="podium">${ord.map((x,i)=>x?`
        <div class="p-item ${sz[i]}">
          <div class="p-av">${x.prenom[0]}${x.nom[0]}</div>
          <div class="p-nom">${x.prenom} ${x.nom}</div>
          <div class="p-pts">${x.total_points.toFixed(1)} pts</div>
          <div class="p-bloc">${em[i]}</div>
        </div>`:"").join("")}</div>`;
    }
    document.getElementById("cl-list").innerHTML=cl.length?cl.map(x=>`
      <div class="cl-row${x.id_participant===user.id_participant?" moi":""}">
        <div class="cl-rang">${fmt.rang(x.rang)}</div>
        <div class="cl-av" style="background:${x.sexe==="femme"?"#c0397a":x.sexe==="homme"?"#1d5fa8":"#1d7a4a"};color:#fff">${x.prenom[0]}${x.nom[0]}</div>
        <div class="cl-info">
          <div class="cl-nom">${x.prenom} ${x.nom}${x.id_participant===user.id_participant?' <span class="badge badge-green">Moi</span>':''}</div>
          <div class="cl-sub">${x.equipe_nom?`👥 ${x.equipe_nom} · `:""}${x.nb_activites} activité(s) · ${fmt.mins(x.total_minutes)}</div>
        </div>
        <div class="cl-bar"><div class="progress"><div class="progress-bar" style="width:${Math.round(x.total_points/mx*100)}%"></div></div></div>
        <div class="cl-pts">${x.total_points.toFixed(1)}</div>
      </div>`).join(""):emptyState("🏆","Aucun participant","Saisissez votre première activité !");
  }catch{document.getElementById("cl-list").innerHTML=emptyState("⚠️","Erreur de chargement");}
}
async function loadEq(){
  try{
    const cl=await GET(`/stats/classement/equipes${p()}`);
    document.getElementById("cl-eq").innerHTML=cl.length?cl.map(e=>`
      <div class="eq-row">
        <div style="width:34px;text-align:center;font-size:1rem;font-weight:700;flex-shrink:0">${fmt.rang(e.rang)}</div>
        <div style="flex:1">
          <div style="font-size:.9rem;font-weight:700;color:var(--text)">${e.nom}</div>
          <div style="font-size:.75rem;color:var(--text3);margin-top:.15rem">${e.nb_membres} membre(s) · ${e.nb_activites} activités · Moy: ${e.moyenne_points.toFixed(1)} pts/membre</div>
        </div>
        <div style="text-align:right">
          <div style="font-family:var(--font-head);font-size:1.1rem;font-weight:800;color:var(--accent)">${e.total_points.toFixed(1)}</div>
          <div style="font-size:.72rem;color:var(--text3)">points</div>
        </div>
      </div>`).join(""):emptyState("👥","Aucune équipe");
  }catch{document.getElementById("cl-eq").innerHTML=emptyState("⚠️","Erreur");}
}
async function loadPop(){
  try{
    const data=await GET(`/stats/activites/populaires${p()}`);
    document.getElementById("pop-tb").innerHTML=data.length?data.map((a,i)=>`
      <tr><td><strong>#${i+1}</strong></td><td>${a.nom}</td><td>${a.nb_saisies}</td><td>${fmt.mins(a.total_minutes)}</td><td><span class="pts-badge">${a.total_points.toFixed(1)}</span></td></tr>`).join("")
      :`<tr><td colspan="5">${emptyState("🏃","Aucune donnée")}</td></tr>`;
  }catch{}
}
async function loadStats(){
  try{
    const[r,rep]=await Promise.all([GET(`/stats/resume${p()}`),GET(`/stats/repartition/sexe${p()}`)]);
    document.getElementById("g-pts").textContent=r.total_points.toFixed(1);
    document.getElementById("g-part").textContent=r.nb_participants;
    document.getElementById("g-h").textContent=r.heures_activite+"h";
    document.getElementById("g-nb").textContent=r.nb_saisies;
    const tot=rep.reduce((s,x)=>s+x.total_points,0)||1;
    const lbl={homme:"Homme",femme:"Femme",mixte:"Mixte/NP"};
    const col={homme:"var(--blue)",femme:"#e91e8c",mixte:"var(--accent)"};
    document.getElementById("rep-sexe").innerHTML=rep.map(x=>{
      const pct=Math.round(x.total_points/tot*100);
      return `<div style="margin-bottom:1rem">
        <div style="display:flex;justify-content:space-between;margin-bottom:.4rem">
          <span style="font-size:.82rem;font-weight:600">${lbl[x.sexe]||x.sexe}</span>
          <span style="font-size:.78rem;color:var(--text3)">${x.nb_participants} pers. · ${x.total_points.toFixed(1)} pts</span>
        </div>
        <div class="progress"><div class="progress-bar" style="width:${pct}%;background:${col[x.sexe]||'var(--accent)'}"></div></div>
        <div style="font-size:.72rem;color:var(--text3);margin-top:.2rem">${pct}% des points</div>
      </div>`;}).join("")||emptyState("📊","Aucune donnée");
    document.getElementById("resume").innerHTML=`
      ${[["Points totaux",r.total_points.toFixed(1)],["Saisies",r.nb_saisies],["Heures d'activité",r.heures_activite+"h"],["Participants",r.nb_participants],["Équipes",r.nb_equipes]].map(([l,v])=>`
      <div style="display:flex;justify-content:space-between;padding:.5rem .625rem;background:var(--bg3);border-radius:var(--radius-xs);margin-bottom:.4rem">
        <span style="font-size:.82rem;color:var(--text2)">${l}</span>
        <strong style="font-size:.875rem">${v}</strong>
      </div>`).join("")}`;
  }catch{}
}
init();
</script>
</body>
</html>
